<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Villa Caetano — Open Log</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#202321;--muted:#777b78;--border:#e5e5e0;--accent:#234d3c;--soft:#eaf1ed;--shadow:0 8px 30px rgba(20,25,22,.06)}
html[data-theme=dark]{--bg:#151816;--card:#1e2421;--text:#eef2ef;--muted:#9ba59f;--border:#343d38;--accent:#9bc5af;--soft:#26352d;--shadow:0 8px 30px rgba(0,0,0,.2)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.container{max-width:1100px;margin:auto;padding:28px}
header,.report{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:18px}
header{padding:22px 26px;display:flex;justify-content:space-between;align-items:center}.logo{width:210px;max-height:80px;object-fit:contain;object-position:left}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{padding:9px 13px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-weight:700;text-decoration:none;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
h1{font-size:28px;margin:28px 0 5px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}.report{padding:22px}.report-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.count{font-weight:800;color:var(--accent)}.issue{padding:19px 0;border-bottom:1px solid var(--border);overflow:hidden}.issue:last-child{border-bottom:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.top>div:first-child{min-width:0}.title{font-size:17px;font-weight:800;line-height:1.35;overflow-wrap:anywhere;word-break:break-word}.meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45;overflow-wrap:anywhere}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:800}.high{background:#f7e1de;color:#8e332d}.medium{background:#f1ead6;color:#79611b}.low{background:var(--soft)}.desc{font-size:13px;line-height:1.6;margin-top:12px;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}.resolution{margin-top:10px;padding:10px 12px;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;background:var(--soft);border-left:3px solid var(--accent);font-size:12px}.empty{text-align:center;color:var(--muted);padding:40px}.error{display:none;color:#a33b35;background:#fff1f0;border:1px solid #f0c8c5;padding:12px;border-radius:10px;margin-top:15px}
@media(max-width:700px){.container{padding:14px}header{padding:18px;flex-direction:column;align-items:flex-start;gap:15px}.actions{width:100%;justify-content:flex-start}.top{flex-direction:column}.top>div:last-child{width:100%}}

@media(max-width:600px){
  .container{padding:10px}.report{padding:12px;border-radius:14px}header{padding:12px 14px;border-radius:14px;gap:8px}.logo{width:150px;max-height:55px}
  .actions{gap:6px}.actions .btn{padding:7px 9px;font-size:11px}.share-main{font-size:11px}
  h1{font-size:21px;margin:13px 0 3px}.sub{font-size:11px;margin-bottom:9px}.report-head{margin-bottom:8px;font-size:12px}.count{font-size:11px}.issue{padding:11px 0}.title{font-size:13px}.meta{font-size:10px;margin-top:3px}.badge{padding:4px 6px;font-size:9px}.desc{font-size:11px;line-height:1.4;margin-top:7px}
}
@media print{header .actions,.sub{display:none!important}.container{max-width:none;padding:0}.report{box-shadow:none;border:0}body{background:#fff}}
''</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<main class="container">
<header><img id="logo" class="logo" src="assets/black-logo.png" alt="Villa Caetano"><div class="actions"><a class="btn" href="index.html">← Log</a><button class="btn" id="theme">☾</button><button class="btn primary share-main" id="shareBtn" type="button">↗ Share PDF</button><button class="btn" onclick="window.print()">Print</button></div></header>
<h1>Open Log</h1><div class="sub">Current issues and action points requiring attention.</div>
<div id="error" class="error"></div>
<section class="report"><div class="report-head"><strong>Open Log Report</strong><span class="count" id="count">Loading...</span></div><div id="list"></div></section>
</main>
<script>
const SUPABASE_URL="https://tynimykxncdzdxupqhcx.supabase.co",SUPABASE_KEY="sb_publishable_KbjJrEnhwk4pUvsvA16NfA_2R90lxlB",H={"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json"};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v?new Date(v+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"—";
function buildPdf(){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
  const margin=16, width=210-margin*2; let y=18;
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.text("Villa Caetano",margin,y); y+=8;
  doc.setFontSize(15); doc.text("Open Log Report",margin,y); y+=7;
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text(document.getElementById("count").textContent,margin,y); y+=9;
  const items=[...document.querySelectorAll("#list .issue")];
  items.forEach((el,idx)=>{
    const title=el.querySelector(".title")?.textContent||"";
    const meta=el.querySelector(".meta")?.textContent||"";
    const desc=el.querySelector(".desc")?.textContent||"";
    if(y>270){doc.addPage();y=18}
    doc.setFont("helvetica","bold");doc.setFontSize(11);
    const titleLines=doc.splitTextToSize(`${idx+1}. ${title}`,width);doc.text(titleLines,margin,y);y+=titleLines.length*5;
    doc.setFont("helvetica","normal");doc.setFontSize(8);const metaLines=doc.splitTextToSize(meta,width);doc.text(metaLines,margin,y);y+=metaLines.length*4.2+2;
    if(desc){const lines=doc.splitTextToSize(desc,width);doc.setFontSize(9);doc.text(lines,margin,y);y+=lines.length*4.4+3}
    doc.setDrawColor(220);doc.line(margin,y,width+margin,y);y+=6;
  });
  return doc;
}
async function shareReport(){
  try{
    const doc=buildPdf(); const blob=doc.output("blob");
    const file=new File([blob],"Villa-Caetano-Open-Log.pdf",{type:"application/pdf"});
    const shareData={title:"Villa Caetano — Open Log Report",text:`Villa Caetano — Open Log Report\n${document.getElementById("count").textContent}\n${location.href}`,files:[file]};
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){await navigator.share(shareData);return}
    doc.save("Villa-Caetano-Open-Log.pdf");
    const wa=`https://wa.me/?text=${encodeURIComponent(`Villa Caetano — Open Log Report\n${document.getElementById("count").textContent}\n${location.href}`)}`;
    window.open(wa,"_blank");
  }catch(e){if(e?.name!=="AbortError"){console.error(e);alert("Could not create the PDF report.")}}
}
document.getElementById("shareBtn").addEventListener("click",shareReport);
async function load(){try{
 const r=await fetch(`${SUPABASE_URL}/rest/v1/issues?select=*&status=neq.Resolved&order=priority.asc,date_reported.asc`,{headers:H});if(!r.ok)throw Error(await r.text());
 const a=await r.json();document.getElementById("count").textContent=`${a.length} open item${a.length===1?"":"s"}`;
 document.getElementById("list").innerHTML=a.length?a.map(i=>`<article class="issue"><div class="top"><div><div class="title">${esc(i.title)}</div><div class="meta">${esc(i.entry_type||"Issue")} · Reported ${fmt(i.date_reported)} · Due ${fmt(i.due_date)}</div></div><div><span class="badge ${String(i.priority).toLowerCase()}">${esc(i.priority)} priority</span> <span class="badge">${esc(i.status)}</span></div></div>${i.description?`<div class="desc">${esc(i.description)}</div>`:""}</article>`).join(""):`<div class="empty">No open items. Everything is currently resolved.</div>`;
}catch(e){document.getElementById("count").textContent="Unable to load";document.getElementById("error").style.display="block";document.getElementById("error").textContent="Unable to load the open log report: "+e.message;console.error(e)}}
const savedTheme=localStorage.getItem("vc-theme");
const darkTheme=savedTheme==="dark"||(savedTheme===null&&matchMedia("(prefers-color-scheme:dark)").matches);
document.documentElement.setAttribute("data-theme",darkTheme?"dark":"light");
function updateTheme(){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  document.getElementById("theme").textContent=dark?"☀":"☾";
  document.getElementById("logo").src=dark?"assets/logo-white.png":"assets/black-logo.png";
}
updateTheme();
document.getElementById("theme").onclick=()=>{
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  const next=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem("vc-theme",next);
  updateTheme();
};
load();
</script>
</body></html>
